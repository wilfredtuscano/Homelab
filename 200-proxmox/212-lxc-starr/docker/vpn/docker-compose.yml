services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=US/Pacific
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
    ports:
      # Gluetun control server (public IP API, status)
      - 8000:8000
      # QBT UI Port
      - 8090:8090
      # Bittorrent port
      - 56881:56881
      - 56881:56881/udp

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    security_opt:
      - apparmor=unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=US/Pacific
      - WEBUI_PORT=8090
      - TORRENTING_PORT=56881
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/nfs/downloads:/downloads
    # Not restarted by Docker. After a reboot the daemon would start it
    # alongside gluetun and ignore depends_on, before the tunnel is healthy.
    # vpn-watchdog (see README) is its only automatic starter, and restarts it
    # after a tunnel reconnect leaves its sockets stale.
    restart: "no"
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
