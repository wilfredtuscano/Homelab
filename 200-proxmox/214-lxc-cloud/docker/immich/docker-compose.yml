services:
  immich-server:
    # Pinned to an exact release. Bump server, both ML containers (here and
    # on jarvis) and the database/cache images together, from that release's
    # docker/docker-compose.yml upstream - see README "Upgrading Immich".
    image: ghcr.io/immich-app/immich-server:v3.3.5
    container_name: immich-server
    # Force UID/GID 1000:1000 so writes to the NFS-backed UPLOAD_LOCATION land
    # as wtuscano:Admin on TrueNAS (both are UID/GID 1000). Immich's default
    # container user is not 1000 and hits EACCES otherwise.
    user: "1000:1000"
    security_opt:
      - apparmor=unconfined
    environment:
      # ML runs on jarvis (205) against the Strix Halo iGPU - 2.6x the
      # throughput of running it here, and it keeps a bursty workload off this
      # host. See 205-gmktek/docker/immich-ml/. There is no local ML container:
      # if jarvis is down, uploads still work and smart search / face jobs
      # queue until it is back. README "Machine learning" has the recovery path.
      - IMMICH_MACHINE_LEARNING_URL=http://192.168.1.205:3003
      - UPLOAD_LOCATION=/mnt/nfs/immich
      - DB_HOSTNAME=immich_db
      - DB_USERNAME=immich
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich_redis
      - TZ=America/Los_Angeles
    volumes:
      - /mnt/nfs/immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    networks:
      - immich_internal
    depends_on:
      immich_db:
        condition: service_healthy
      immich_redis:
        condition: service_healthy
    restart: unless-stopped

  immich_redis:
    # Valkey, as in upstream's compose. Job queue only, nothing persisted.
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich_redis
    security_opt:
      - apparmor=unconfined
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks:
      - immich_internal
    restart: unless-stopped

  immich_db:
    # Immich-published Postgres 14 with the vectorchord extension, exactly as
    # in upstream's compose for the pinned release. On a newer vchord, Immich
    # runs ALTER EXTENSION and reindexes by itself at startup (needs the DB
    # user to be superuser, which it is). After that the old image will not
    # start, so rollback is a snapshot or a restore, not a tag change.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_db
    security_opt:
      - apparmor=unconfined
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=immich
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ./db:/var/lib/postgresql/data
    # Docker's 64 MB default is too small for parallel queries and vacuums.
    shm_size: 128mb
    networks:
      - immich_internal
    # The image ships its own healthcheck (pg_isready as POSTGRES_USER plus a
    # data-checksum failure count). The old pg_isready without --username
    # logged 'role "root" does not exist' every 10s.
    healthcheck:
      disable: false
    restart: unless-stopped

networks:
  immich_internal:
