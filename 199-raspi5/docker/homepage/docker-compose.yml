services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3002:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.local.wilfredtuscano.com
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
