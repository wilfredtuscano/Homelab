global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # System metrics from all VMs via Node Exporter
  - job_name: node
    static_configs:
      - targets:
          - '192.168.1.199:9100'
          - '192.168.1.202:9100'
          - '192.168.1.203:9100'
          - '192.168.1.204:9100'
          - '192.168.1.205:9100'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([\d.]+):\d+'
        target_label: instance
        replacement: '${1}'
      - source_labels: [instance]
        regex: '192\.168\.1\.199'
        target_label: host
        replacement: raspi5
      - source_labels: [instance]
        regex: '192\.168\.1\.202'
        target_label: host
        replacement: starr
      - source_labels: [instance]
        regex: '192\.168\.1\.203'
        target_label: host
        replacement: plex
      - source_labels: [instance]
        regex: '192\.168\.1\.204'
        target_label: host
        replacement: cloud
      - source_labels: [instance]
        regex: '192\.168\.1\.205'
        target_label: host
        replacement: jarvis

  # Container metrics from all VMs via cAdvisor
  - job_name: cadvisor
    static_configs:
      - targets:
          - '192.168.1.199:9080'
          - '192.168.1.202:9080'
          - '192.168.1.203:9080'
          - '192.168.1.204:9080'
          - '192.168.1.205:9080'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([\d.]+):\d+'
        target_label: instance
        replacement: '${1}'
      - source_labels: [instance]
        regex: '192\.168\.1\.199'
        target_label: host
        replacement: raspi5
      - source_labels: [instance]
        regex: '192\.168\.1\.202'
        target_label: host
        replacement: starr
      - source_labels: [instance]
        regex: '192\.168\.1\.203'
        target_label: host
        replacement: plex
      - source_labels: [instance]
        regex: '192\.168\.1\.204'
        target_label: host
        replacement: cloud
      - source_labels: [instance]
        regex: '192\.168\.1\.205'
        target_label: host
        replacement: jarvis
