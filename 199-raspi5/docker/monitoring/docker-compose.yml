services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml
      - ./loki/data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  # Hypervisor-side metrics for every Proxmox guest (VMs and LXCs),
  # including TrueNAS which has no in-guest exporter.
  # Auth is a read-only PVEAuditor API token (prometheus@pve!monitoring).
  # Not published on the host - Prometheus reaches it over the compose network.
  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    environment:
      - PVE_USER=${PVE_USER}
      - PVE_TOKEN_NAME=${PVE_TOKEN_NAME}
      - PVE_TOKEN_VALUE=${PVE_TOKEN_VALUE}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL}
    networks:
      - monitoring
    restart: unless-stopped

  # In-guest metrics for TrueNAS (192.168.1.201), which cannot run an exporter.
  # Config is split so no secret is committed: snmp.yml holds the modules and
  # is in git; auth.yml holds the community and is gitignored, host-only.
  # snmp_exporter merges repeated --config.file arguments.
  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    command:
      - '--config.file=/etc/snmp_exporter/snmp.yml'
      - '--config.file=/etc/snmp_exporter/auth.yml'
    volumes:
      - ./snmp/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
      - ./snmp/auth.yml:/etc/snmp_exporter/auth.yml:ro
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.local.wilfredtuscano.com
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

networks:
  monitoring:
